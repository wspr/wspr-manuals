name: Build manuals and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      manuals: ${{ steps.find.outputs.manuals }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Find manual directories
        run: |
          manuals=$(find . -mindepth 1 -maxdepth 1 -type d -not -name '.*' -printf '%f\n' \
            | while read -r d; do [ -f "$d/$d.tex" ] && printf '%s\n' "$d"; done \
            | sort -u | jq -R -s -c 'split("\n")[:-1]')
          echo "manuals=$manuals" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.manuals != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manual: ${{ fromJson(needs.discover.outputs.manuals) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile ${{ matrix.manual }}
        uses: dante-ev/latex-action@2026-A
        with:
          root_file: ${{ matrix.manual }}.tex
          working_directory: ${{ matrix.manual }}

      - name: Move PDF out of the manual directory
        run: mv "${{ matrix.manual }}/${{ matrix.manual }}.pdf" "${{ matrix.manual }}.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.manual }}
          path: ${{ matrix.manual }}.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download all manual PDFs
        uses: actions/download-artifact@v4
        with:
          path: site
          pattern: pdf-*
          merge-multiple: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
